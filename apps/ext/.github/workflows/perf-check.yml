name: Performance Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to profile'
        required: true
        default: 'http://localhost:3000'

jobs:
  perf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build analyzer
        run: cd packages/analyzer && bun run build

      - name: Run performance check
        env:
          PROFILE_PATH: ./perf-profile.json
          BUDGET_PATH: ./perf-budget.json
        run: |
          if [ -f "$PROFILE_PATH" ]; then
            bun packages/cli/src/cli.ts check --profile "$PROFILE_PATH" --budget "$BUDGET_PATH"
          else
            echo "No profile file found at $PROFILE_PATH — skipping perf check"
          fi
